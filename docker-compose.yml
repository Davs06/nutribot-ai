version: '3.8'

services:
  # ============================================
  # BACKEND - API Node.js
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: nutribot-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - USDA_API_KEY=${USDA_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-nutribot-secret-change-me}
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=https://nutribot.local
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`nutribot.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=3333"
      - "traefik.http.routers.backend.middlewares=api-ratelimit,strip-api-prefix,cors-headers"
      # Health check
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.backend.loadbalancer.healthcheck.timeout=10s"
    depends_on:
      - traefik
    networks:
      - nutribot-network

  # ============================================
  # FRONTEND - React App (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: nutribot-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`nutribot.local`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.middlewares=compress,security-headers"
      # Health check
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.timeout=10s"
    depends_on:
      - backend
    networks:
      - nutribot-network
      - web

networks:
  nutribot-network:
    driver: bridge
    name: nutribot-network
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  backend-data:
    name: nutribot-backend-data
  backend-uploads:
    name: nutribot-backend-uploads
